<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>九宮姓名磁場精準分析系統-代數矩陣版</title>
    <style>
        /* 大地自然色系與大師級專業視覺質感 */
        body {
            font-family: "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
            background-color: #FDFBF7;
            color: #3E2723;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 780px;
            background: #FFFFFF;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #D2B48C;
            box-shadow: 2px 2px 15px rgba(0,0,0,0.05);
        }
        h1 { text-align: center; color: #3E2723; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #757575; font-size: 0.9em; margin-bottom: 25px; }
        
        /* Tab 分頁樣式 */
        .tab-menu { display: flex; border-bottom: 2px solid #E0D8C8; margin-bottom: 25px; }
        .tab-btn { 
            padding: 12px 20px; 
            background: none; 
            border: none; 
            cursor: pointer; 
            font-size: 16px; 
            color: #757575; 
            font-weight: bold;
        }
        .tab-btn.active { color: #5D6D3E; border-bottom: 3px solid #5D6D3E; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* 表單與欄位 */
        .input-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #5D6D3E; }
        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #D2B48C;
            border-radius: 8px;
            font-size: 16px;
            background-color: #FAFAFA;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #5D6D3E;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #4A5732; }
        
        /* 五大格局矩陣視覺 */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin: 20px 0;
        }
        .grid-box {
            border: 1px solid #D2B48C;
            border-radius: 8px;
            padding: 12px 8px;
            text-align: center;
            background-color: #FFFDF9;
            cursor: help;
            transition: transform 0.2s;
        }
        .grid-box:hover { transform: scale(1.02); background-color: #FFF9F2; }
        .grid-label { font-size: 0.9em; color: #3E2723; font-weight: bold; margin-bottom: 3px; }
        .grid-formula { font-size: 0.72em; color: #A1887F; margin-bottom: 5px; }
        .grid-val { font-size: 1.7em; font-weight: bold; color: #3E2723; }
        .grid-wuxing { font-size: 0.95em; font-weight: bold; margin-top: 3px; }

        /* 五行色彩標籤 */
        .wuxing-木 { color: #2E7D32; }
        .wuxing-火 { color: #C62828; }
        .wuxing-土 { color: #8D6E63; }
        .wuxing-金 { color: #F57F17; }
        .wuxing-水 { color: #1565C0; }
        
        /* 報告與分析 */
        .report-box {
            border: 1px solid #E0D8C8;
            border-radius: 10px;
            padding: 20px;
            background-color: #FAF8F5;
            line-height: 1.6;
        }
        .report-section { margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px dashed #E0D8C8; }
        .report-section:last-child { border-bottom: none; }
        .section-title { font-weight: bold; color: #5D6D3E; font-size: 1.1em; margin-bottom: 8px; border-left: 4px solid #5D6D3E; padding-left: 8px; }

        .db-status { font-size: 0.95em; color: #5D6D3E; text-align: center; margin-bottom: 20px; font-weight: bold; background-color: #F5F2EB; padding: 10px; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #E0D8C8; padding: 10px; text-align: center; }
        th { background-color: #F5F2EB; color: #5D6D3E; }
        .delete-btn { background-color: #C62828; padding: 5px 10px; font-size: 14px; width: auto; }
    </style>
</head>
<body>

<div class="container">
    <h1>📜 九宮姓名磁場精準分析系統</h1>
    <div class="subtitle">紫微斗數規劃師專用高級整合後台</div>
    
    <div class="tab-menu">
        <button class="tab-btn active" onclick="switchTab('analysisTab', this)">🔮 姓名精準 analysis</button>
        <button class="tab-btn" onclick="switchTab('managementTab', this); renderCustomWordList();">⚙️ 自訂字庫管理</button>
    </div>

    <div id="analysisTab" class="tab-content active">
        <div class="input-group">
            <label for="nameInput">請輸入客戶姓名 (支援標準三字姓名)</label>
            <input type="text" id="nameInput" placeholder="例如：林龍祥">
        </div>
        <button onclick="analyzeNinePalaceSystem()">開始九宮格局分析</button>

        <div id="resultArea" style="display: none;">
            <h3 style="color: #3E2723; margin-top: 25px;">📊 五大格局筆劃矩陣 (滑鼠懸停看詳解)</h3>
            
            <div id="baseStrokesDetail" style="font-size: 0.9em; color: #5D6D3E; margin-bottom: 10px; font-weight: bold;"></div>

            <div class="grid-container">
                <div class="grid-box" title="天格【頭腦】:父母或父母身體、長輩、師長、長官(老闆)、股東、丈夫、岳父母或岳父母身體、田宅、公司、工廠、事業、看配偶的工作及運程。">
                    <div class="grid-label">天格【頭腦】</div>
                    <div class="grid-formula">姓氏 + 1劃</div>
                    <div class="grid-val" id="valA">0</div>
                    <div class="grid-wuxing" id="wuxingA">--</div>
                </div>
                <div class="grid-box" title="人格【心態】:身體狀況(胸部、心臟)、自己、耕種、意志、興趣、表現、思想、氣質、才華、財氣、人際關係、夫妻感情深淺濃淡。">
                    <div class="grid-label">人格【心態】</div>
                    <div class="grid-formula">姓氏 + 名一</div>
                    <div class="grid-val" id="valB">0</div>
                    <div class="grid-wuxing" id="wuxingB">--</div>
                </div>
                <div class="grid-box" title="地格【內在】:環境、下屬(部屬)、僕人、鄰居、親友、婚姻相處關係、子女、兄弟姐妹、財庫。">
                    <div class="grid-label">地格【內在】</div>
                    <div class="grid-formula">名一 + 名二</div>
                    <div class="grid-val" id="valC">0</div>
                    <div class="grid-wuxing" id="wuxingC">--</div>
                </div>
                <div class="grid-box" title="外格【遷移】:自己的外在、個性內向或外向、出外、朋友、貴人、他人、人際、環境、搬家、合夥、對手。">
                    <div class="grid-label">外格【遷移】</div>
                    <div class="grid-formula">名二 + 1劃</div>
                    <div class="grid-val" id="valE">0</div>
                    <div class="grid-wuxing" id="wuxingE">--</div>
                </div>
                <div class="grid-box" title="總格看【行動】:一生遇到的機會點、決策、事業、名譽、地位、行為、福祿、成果、貴人、財源。">
                    <div class="grid-label">總格【行動】</div>
                    <div class="grid-formula">姓名總筆劃</div>
                    <div class="grid-val" id="valD">0</div>
                    <div class="grid-wuxing" id="wuxingD">--</div>
                </div>
            </div>

            <h3 style="color: #3E2723; margin-top: 25px;">🔍 思想與行為功能磁場解說</h3>
            <div class="report-box" id="analysisReport"></div>
        </div>
    </div>

    <div id="managementTab" class="tab-content">
        <div class="db-status" id="dbStatus">✅ 內建字庫就緒！已收錄 4436 個漢字磁場數據。</div>

        <h3 style="color: #3E2723; margin-top: 25px;">➕ 新增自訂未收錄字詞</h3>
        <div style="background: #FFFDF9; border: 1px solid #D2B48C; padding: 15px; border-radius: 8px;">
            <div class="input-group" style="display: flex; gap: 10px; margin-bottom: 10px;">
                <input type="text" id="newCharInput" placeholder="漢字" maxlength="1" style="flex: 1;">
                <input type="number" id="newStrokeInput" placeholder="康熙筆劃" style="flex: 1;">
            </div>
            <button onclick="saveCustomWord()">儲存至自訂字庫</button>
        </div>

        <h3 style="color: #3E2723; margin-top: 30px;">📋 目前手動擴充的字詞</h3>
        <table>
            <thead>

                    <th>自訂筆劃</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="customWordTableBody"></tbody>
        </table>
    </div>
</div>

// 核心九宮格局運算引擎
function analyzeNinePalaceSystem() {
    const name = document.getElementById("nameInput").value.trim();
    if (name.length < 2) { alert("請輸入完整的姓名（至少兩個字）。"); return; }

    let strokes = [];
    for (let i = 0; i < name.length; i++) {
        let char = name[i];
        let s = localCustomDatabase[char] ? localCustomDatabase[char].stroke : strokeDatabase[char];
        if (s === undefined) {
            alert(`【字庫不足】偵測到未收錄漢字：${char}，請先到「自訂字庫管理」分頁手動增補筆劃。`);
            return;
        }
        strokes.push(s);
    }

    let s_surname = strokes[0] || 0;
    let s_name1 = strokes[1] || 0;
    let s_name2 = strokes[2] || 0; 

    document.getElementById("baseStrokesDetail").innerText = 
        `單字筆劃拆解 ➔ ${name[0]}:${s_surname}劃 | ${name[1]||''}:${s_name1}劃 ${name[2]?('| '+name[2]+':'+s_name2+'劃'):''}`;

    // 各局公式
    let totalA = s_surname + 1;                 // 天格：姓氏 + 1
    let totalB = s_surname + s_name1;           // 人格：姓氏 + 名一
    let totalC = s_name1 + s_name2;             // 地格：名一 + 名二
    let totalE = s_name2 + 1;                   // 外格：名二 + 1
    let totalD = s_surname + s_name1 + s_name2; // 總格：姓名總筆劃

    let fA = wuxingMap[totalA % 10];
    let fB = wuxingMap[totalB % 10];
    let fC = wuxingMap[totalC % 10];
    let fE = wuxingMap[totalE % 10];
    let fD = wuxingMap[totalD % 10];

    document.getElementById("valA").innerText = totalA;
    document.getElementById("wuxingA").innerHTML = `<span class="wuxing-${fA}">${fA}</span>`;
    
    document.getElementById("valB").innerText = totalB;
    document.getElementById("wuxingB").innerHTML = `<span class="wuxing-${fB}">${fB}</span>`;
    
    document.getElementById("valC").innerText = totalC;
    document.getElementById("wuxingC").innerHTML = `<span class="wuxing-${fC}">${fC}</span>`;

    document.getElementById("valE").innerText = totalE;
    document.getElementById("wuxingE").innerHTML = `<span class="wuxing-${fE}">${fE}</span>`;
    
    document.getElementById("valD").innerText = totalD;
    document.getElementById("wuxingD").innerHTML = `<span class="wuxing-${fD}">${fD}</span>`;

    // 進行生剋演算法連動
    let relation1 = checkWuxingRelation(fA, fB); // 思想功能：天格 ➔ 人格
    let relation2 = checkWuxingRelation(fB, fC); // 行為功能：人格 ➔ 地格

    let reportHtml = "";
    reportHtml += generateReportSection("🧠「思想功能」 (天格【頭腦】 ➔ 人格【心態】) — 象徵理智、制度化、給人第一眼的印象", relation1);
    reportHtml += generateReportSection("⚡「行為功能」 (人格【心態】 ➔ 地格【內在】) — 象徵動作、感覺、往來一陣子的印象、對婚姻的態度", relation2);

    document.getElementById("analysisReport").innerHTML = reportHtml;
    document.getElementById("resultArea").style.display = "block";
}

    const c1 = codeMap[w1];
    const c2 = codeMap[w2];

    // 1. 判定【相生】關係 (木生火=1➝2, 火生土=2➝3, 土生金=3➝4, 金生水=4➝5, 水生木=5➝1)
    if (c2 - c1 === 1 || (c1 === 5 && c2 === 1)) {
        return { type: "相生", key: w1 + "生" + w2 }; // 順生 (上生下)
    }
    if (c1 - c2 === 1 || (c2 === 5 && c1 === 1)) {
        return { type: "相生", key: w2 + "生" + w1 }; // 逆生 (下生上，如水在上金在下 ➔ 金生水)
    }

    // 2. 判定【相剋】關係 (木剋土=1➝3, 土剋水=3➝5, 水剋火=5➝2, 火剋金=2➝4, 金剋木=4➝1)
    // 順剋檢查 (上剋下)
    if ((c1===1 && c2===3) || (c1===3 && c2===5) || (c1===5 && c2===2) || (c1===2 && c2===4) || (c1===4 && c2===1)) {
        return { type: "相剋", key: w1 + "剋" + w2 };
    }
    // 逆剋檢查 (下剋上)
    if ((c2===1 && c1===3) || (c2===3 && c1===5) || (c2===5 && c1===2) || (c2===2 && c1===4) || (c2===4 && c1===1)) {
        return { type: "相剋", key: w2 + "剋" + w1 };
    }

    return { type: "安全留白", key: "資料不足" };
}

function generateReportSection(title, relation) {
    if (relation.type === "平宮") {
        return `
            <div class="report-section">
                <div class="section-title">${title} (${relation.key})</div>
                <p style="color: #757575;">ℹ️ 該格局為相同的五行平宮，依指示目前先予保留，待後續上傳詳細資料後再行擴充追加。</p>
            </div>
        `;
    }
    
    let match = interpretationTexts[relation.key];
    if (match) {
        return `
            <div class="report-section">
                <div class="section-title">${title} — ${match.title}</div>
                <p><strong>${match.feature}</strong></p>
                <p>${match.content}</p>
            </div>
        `;
    } else {
        // 允許留白原則
        return `
            <div class="report-section">
                <div class="section-title">${title} (${relation.key})</div>
                <p style="color: #C62828;">【資料不足，無法確認】該生剋組合之學理解說文本尚未錄入系統。</p>
            </div>
        `;
    }
}

function saveCustomWord() {
    const char = document.getElementById("newCharInput").value.trim();
    const stroke = parseInt(document.getElementById("newStrokeInput").value.trim(), 10);
    if (!char || isNaN(stroke)) { alert("請輸入正確的漢字與筆劃。"); return; }
    localCustomDatabase[char] = { stroke: stroke };
    localStorage.setItem('customStrokeDict', JSON.stringify(localCustomDatabase));
    document.getElementById("newCharInput").value = "";
    document.getElementById("newStrokeInput").value = "";
    renderCustomWordList();
    alert(`成功儲存：${char} = ${stroke} 劃`);
}

function deleteCustomWord(char) {
    if (confirm(`確定要刪除「${char}」嗎？`)) {
        delete localCustomDatabase[char];
        localStorage.setItem('customStrokeDict', JSON.stringify(localCustomDatabase));
        renderCustomWordList();
    }
}

function renderCustomWordList() {
    const tbody = document.getElementById("customWordTableBody");
    tbody.innerHTML = "";
    const keys = Object.keys(localCustomDatabase);
    if (keys.length === 0) {
        tbody.innerHTML = `<tr><td colspan="3" style="color:#757575;">目前尚無手動增補字詞</td></tr>`;
        return;
    }
    keys.forEach(char => {
        let tr = document.createElement("tr");
        tr.innerHTML = `<td><strong>${char}</strong></td><td>${localCustomDatabase[char].stroke} 劃</td><td><button class="delete-btn" onclick="deleteCustomWord('${char}')">刪除</button></td>`;
        tbody.appendChild(tr);
    });
}

document.getElementById("dbStatus").innerText = `✅ 內建字庫就緒！已收錄 ${Object.keys(strokeDatabase).length} 個漢字磁場數據。`;
</script>
